[package]
name = "ShunnoScan"
version = "1.0.0"
edition = "2021"
description = "Shunno Scan for Windows — Zero-Cloud Offline Document Scanner, Multi-Script OCR & Searchable PDF Suite"

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "webp"] }
rfd = "0.15"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
regex = "1.11"
ureq = { version = "2.10", features = ["native-tls"] }
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections"
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
